name: Validate and update generated data

on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/actions/**"
      - ".github/workflows/workflow_all_xml_updates.yml"
      - ".github/requirements.lock"
      - "tests/**"
      - "latest_raw_files/**"
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/workflow_all_xml_updates.yml"
      - ".github/requirements.lock"
      - "tests/**"
      - "latest_raw_files/**"

concurrency:
  group: mofa-generated-data
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r .github/requirements.lock
      - name: Compile generators
        run: python -m compileall -q .github/actions tests
      - name: Run tests
        run: python -m pytest -q

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r .github/requirements.lock
      - name: Generate all datasets
        run: python .github/actions/run_generators.py
      - name: Validate generated datasets
        run: python -m pytest -q
      - name: Commit substantive changes once
        run: |
          if git diff --quiet -- README.md latest_raw_files; then
            echo "No generated changes."
            exit 0
          fi
          if ! python .github/actions/has_substantive_changes.py; then
            echo "Only generated timestamps changed; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md latest_raw_files
          git commit -m "chore: update generated Microsoft release data"
          git push
