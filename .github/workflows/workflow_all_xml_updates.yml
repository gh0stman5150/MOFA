name: Validate and update generated data

on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/actions/**"
      - ".github/workflows/workflow_all_xml_updates.yml"
      - ".github/requirements.txt"
      - "tests/**"
      - "office_reset_tools/mofa_community_maintained/scripts/**"
      - "latest_raw_files/**"
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/workflow_all_xml_updates.yml"
      - ".github/requirements.txt"
      - "tests/**"
      - "office_reset_tools/mofa_community_maintained/scripts/**"
      - "latest_raw_files/**"

concurrency:
  group: mofa-generated-data
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements.txt
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r .github/requirements.txt
      - name: Compile generators
        run: python -m compileall -q .github/actions tests
      - name: Run tests
        run: python -m pytest -q

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements.txt
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r .github/requirements.txt
      - name: Generate all datasets
        run: python .github/actions/run_generators.py
      - name: Validate generated datasets
        run: python -m pytest -q
      - name: Detect substantive changes
        id: substantive
        run: |
          if git diff --quiet -- README.md latest_raw_files; then
            echo "No generated changes."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python .github/actions/has_substantive_changes.py; then
            echo "Only generated timestamps changed; no pull request needed."
            git restore -- README.md latest_raw_files
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
      - name: Create or update generated-data pull request
        if: steps.substantive.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/mofa-generated-data
          delete-branch: true
          add-paths: |
            README.md
            latest_raw_files
          commit-message: "chore: update generated Microsoft release data"
          title: "chore: update generated Microsoft release data"
          body: |
            Automated MOFA release-data refresh.

            Generated content has passed the repository validation suite and contains changes beyond timestamps.
