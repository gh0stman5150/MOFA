name: Community script CI

on:
  push:
    paths:
      - "office_reset_tools/mofa_community_maintained/scripts/**"
      - ".github/workflows/community-script-ci.yml"
  pull_request:
    paths:
      - "office_reset_tools/mofa_community_maintained/scripts/**"
      - ".github/workflows/community-script-ci.yml"

permissions:
  contents: read

jobs:
  zsh-syntax:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate community-maintained zsh scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            /bin/zsh -n "$script"
          done < <(find office_reset_tools/mofa_community_maintained/scripts -type f -name '*.zsh' -print0)
